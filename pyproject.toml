[project]
name = "gepad"
version = "0.1.0"
description = "Xbox pad -> keyboard/mouse (macOS, Quartz). Fly the Google Earth flight simulator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adam Domachowski", email = "adam.domachowskig6@gmail.com" }]
dependencies = [
    "pygame>=2.6",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
gepad = "gepad.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gepad"]
